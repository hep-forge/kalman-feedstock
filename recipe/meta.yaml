{% set versions = {
    "1.0.0": "790a54401106d68f8c6da90674cc195408e152dc"
} %}

{% set version = environ.get('COMMIT_VERSION', None) %}
{% set version = version or versions.keys()|first %}
{% set version = version|string %}

{% set name = environ.get('ANACONDA_PACKAGE', 'kalman')|string|lower %}
{% set libtorch = libtorch if libtorch else "0" %}
# CPU or CUDA build (conda_build_config.yaml cuda_compiler_version), with the
# matching libTorch: cpu_generic, or cudaXYZ_generic for CUDA X.YZ
{% set cuda_compiler_version = cuda_compiler_version or "None" %}
{% set cuda = cuda_compiler_version != "None" %}
{% set flavour = "cuda" ~ cuda_compiler_version.replace(".", "") if cuda else "cpu" %}
{% set torch_build = flavour ~ "_generic" %}

# libKalman (formerly libKalmanFramework, kept as a symlink) with all its
# components: Apps (application models), Learn (ONNX and TorchScript policies,
# the batched field solver) and Net (JSON API, REST and MCP servers). The CMake
# package: find_package(Kalman COMPONENTS Apps Learn Net), Kalman::Kalman.
# Plain "#" comments only: the publish workflow's version trimming strips
# {% %}/{{ }} and yaml-loads the rest, so a Jinja comment block breaks it.

package:
  name: {{ name }}
  version: {{ environ.get('ANACONDA_VERSION', version)|replace("-", ".") }}

source:
  git_url: "https://github.com/meiyasan/kalman-world.git"
  git_rev: {{ versions.get(version, version) }}

build:
  # conda-forge's ranking: CUDA builds 200 above CPU ones, and they need a
  # driver (__cuda below), so a machine with an NVIDIA GPU gets the CUDA build
  # and every other machine the CPU one. Pick one with kalman=*=*cpu* / *cuda*.
  number: {{ 200 if cuda else 0 }}
  string: "torch{{ libtorch.replace('.', '') }}_{{ flavour }}_h{{ PKG_HASH }}_{{ PKG_BUILDNUM }}"
  run_exports:
    - {{ pin_subpackage(name, max_pin="x.x") }}

requirements:
  build:
    - {{ compiler('c') }}
    - {{ compiler('cxx') }}
    - {{ stdlib('c') }}
    # libTorch's CMake config enables the CUDA language: nvcc and the toolkit
    - {{ compiler('cuda') }}  # [cuda_compiler_version != "None"]
    - cmake
    - make
  host:
    - libcblas
    - blas-devel   # cblas.h
    - zlib
    # Learn: the same libTorch as root-plus, cpu_generic or cudaXYZ_generic
    # (explicit: the solver would otherwise pick a flavour of its own)
    - libtorch {{ libtorch }}.* {{ torch_build }}*
    # libTorch's CMake config looks up these CUDA libraries
    {% if cuda %}
    - cuda-version {{ cuda_compiler_version }}.*
    {% for dev in ["cuda-cudart-dev", "cuda-nvrtc-dev", "cuda-nvtx-dev", "cuda-cupti-dev", "cuda-driver-dev",
                   "libcublas-dev", "libcufft-dev", "libcurand-dev", "libcusolver-dev", "libcusparse-dev"] %}
    - {{ dev }}
    {% endfor %}
    {% endif %}
    # CPU ONNX Runtime in both builds: libKalmanLearn uses no CUDA execution
    # provider, and the CUDA builds would pull a toolkit of their own
    - onnxruntime-cpp * *_cpu
    # Net
    - nlohmann_json
    - cpp-httplib
    - openssl
    - libsqlite
  run:
    - libtorch {{ libtorch }}.* {{ torch_build }}*
    - __cuda  # [cuda_compiler_version != "None"]

test:
  files:
    - consumer/CMakeLists.txt
  requires:
    - {{ compiler('cxx') }}
    - cmake
    - make
  commands:
    {% for lib in ["Kalman", "KalmanApps", "KalmanLearn", "KalmanNet"] %}
    - test -f $PREFIX/lib/lib{{ lib }}${SHLIB_EXT}
    {% endfor %}
    # the former name, kept as a symlink
    - test -e $PREFIX/lib/libKalmanFramework${SHLIB_EXT}
    - test -f $PREFIX/include/Kalman/Kalman.h
    - test -x $PREFIX/bin/kalman
    # the CMake package finds every component it was built with
    - cmake -S consumer -B consumer/build -DCMAKE_PREFIX_PATH=$PREFIX

about:
  home: "https://github.com/meiyasan/kalman-world"
  license: "LGPL-2.1-or-later"
  license_file: LICENSE
  summary: "libKalman: Kalman-family estimation (KF, EKF, UKF, PF, EnKF, CKF, IMM) in C++20, with application models, learned policies and a JSON/REST/MCP API"

extra:
  recipe-maintainers:
    - meiyasan
