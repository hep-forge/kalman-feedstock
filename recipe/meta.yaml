{% set versions = {
    "1.0.2": "9fdc02dc075450f61a8b9def742519ccc85c6eb6",
    "1.0.1": "100a7eea78ba484d9beb0f913990abb6edc8f243",
    "1.0.0": "35501dcc7f45b5e1c9a69a242d600ff614f0dbb4"
} %}

{% set version = environ.get('COMMIT_VERSION', None) %}
{% set version = version or versions.keys()|first %}
{% set version = version|string %}

{% set name = environ.get('ANACONDA_PACKAGE', 'kalman')|string|lower %}

package:
  name: {{ name }}
  version: {{ environ.get('ANACONDA_VERSION', version)|replace("-", ".") }}

source:
  git_url: "https://max-planck.sv.yc.tcu.ac.jp/dsg/kalman-framework.git"
  git_rev: {{ versions.get(version, version) }}

build:
  number: 0
  run_exports:
    - {{ pin_subpackage(name, max_pin="x.x") }}

requirements:
  build:
    - {{ compiler('c') }}
    - {{ compiler('cxx') }}
    - {{ stdlib('c') }}
    - cmake
    - make
  host:
    - libcblas
    - blas-devel   # cblas.h

test:
  commands:
    - test -f $PREFIX/lib/libKalmanFramework${SHLIB_EXT}
    - test -f $PREFIX/include/Kalman/Kalman.h

about:
  home: "https://max-planck.sv.yc.tcu.ac.jp/dsg/kalman-framework"
  license: "LGPL-2.1-or-later"
  license_file: LICENSE
  summary: "libKalmanFramework: Kalman-family estimation (KF, EKF, UKF, PF, EnKF, CKF, IMM) in C++20, no required dependency"

extra:
  recipe-maintainers:
    - meiyasan
